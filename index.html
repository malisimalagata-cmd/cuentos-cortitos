<style>
  :root{
    --bg:#fff7fb; --card:#ffffff; --ink:#3a2c3f; --muted:#8a7c90;
    --primary:#ff6f91; --primary-d:#e8557a; --blue:#4cc9f0; --yellow:#ffd93d;
    --shadow:0 10px 26px rgba(122,79,110,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Baloo 2','Comic Sans MS','Chalkboard SE','Marker Felt',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink); min-height:100vh; background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 6%, #ffe3ef 0, transparent 40%),
      radial-gradient(circle at 88% 94%, #e3f6ff 0, transparent 42%);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px;margin:0 auto;padding:16px 16px 46px}
  header.top{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
  .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .brand .logo{width:50px;height:50px;flex:0 0 50px;border-radius:14px;box-shadow:var(--shadow)}
  h1{font-size:1.45rem;margin:0;line-height:1.12}
  .sub{font-size:.82rem;color:var(--muted);margin:3px 0 0}
  .lang,.round-btn,.read-btn,.install{
    font-family:inherit;font-weight:800;cursor:pointer;border:0;user-select:none;
  }
  .lang{
    background:#fff;color:var(--primary-d);border:2px solid #ffd0dd;border-radius:999px;
    padding:9px 15px;font-size:.95rem;box-shadow:var(--shadow);
  }
  .round-btn{
    width:52px;height:52px;flex:0 0 52px;border-radius:999px;background:#fff;color:var(--primary-d);
    font-size:1.5rem;line-height:1;box-shadow:var(--shadow);display:grid;place-items:center;
  }
  .round-btn:disabled{opacity:.35;cursor:default}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
  }
  .card{
    font-family:inherit;text-align:center;background:var(--card);border:0;border-radius:24px;
    padding:10px 10px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease;
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .card:active{transform:scale(.96)}
  .thumb{width:100%;border-radius:18px;overflow:hidden;background:#fff;line-height:0}
  .thumb svg{width:100%;height:auto;display:block}
  .card-title{font-size:1rem;font-weight:800;color:var(--ink);line-height:1.2}
  .install{
    display:block;margin:22px auto 0;background:var(--primary);color:#fff;border-radius:999px;
    padding:14px 26px;font-size:1.05rem;box-shadow:var(--shadow);
  }
  .story{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage{
    width:100%;background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);line-height:0;
  }
  .stage svg{width:100%;height:auto;display:block;max-height:46vh}
  .page-text{
    font-size:clamp(1.35rem,5.4vw,2.1rem);font-weight:800;text-align:center;
    margin:2px 6px;line-height:1.35;min-height:3.2em;display:flex;align-items:center;justify-content:center;
  }
  .dots{display:flex;gap:9px;margin:2px 0 4px}
  .dot{width:11px;height:11px;border-radius:999px;background:#f0c9d6}
  .dot.on{background:var(--primary);transform:scale(1.25)}
  .nav{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;margin-top:4px}
  .read-btn{
    flex:1;max-width:300px;background:var(--blue);color:#fff;border-radius:999px;padding:15px 20px;
    font-size:1.08rem;box-shadow:var(--shadow);
  }
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:34px}
  .thumb-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .stage-img{width:100%;height:auto;max-height:48vh;object-fit:contain;display:block;background:#fff}
  .moral{background:#fff7e6;border:3px dashed #ffd93d;border-radius:22px;padding:18px;text-align:center;width:100%}
  .moral .label{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:#d99e00;font-weight:800}
  .moral .txt{font-size:clamp(1.15rem,4.6vw,1.7rem);font-weight:800;margin-top:8px;line-height:1.35}
  .ad-box{margin:22px auto 0;max-width:728px;width:100%;text-align:center;min-height:1px}
  .ad-inner{display:flex;justify-content:center;align-items:center;overflow:hidden}
  .ad-tag{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .ad-ph{border:3px dashed #cbd5e1;border-radius:18px;background:#f8fafc;color:#94a3b8;font-weight:700;padding:26px 10px;font-size:.9rem}
  footer a{color:var(--primary);font-weight:800;text-decoration:none}
  @media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>

/* Pack de 30 cuentos cargado desde cuentos-data.js */
const STORIES = SVG_STORIES.concat(window.PACK_CUENTOS || []);

/* ---------------- Idioma ---------------- */
const I18N = {
  es: { tagline: "Cuentos cortos para leer juntos", back: "Volver", read: "Leer en voz alta", stop: "Parar", prev: "Anterior", next: "Siguiente", install: "Instalar la app", noVoice: "Tu navegador no soporta la lectura en voz alta." },
  en: { tagline: "Short stories to read together", back: "Back", read: "Read aloud", stop: "Stop", prev: "Previous", next: "Next", install: "Install app", noVoice: "Your browser does not support read aloud." }
};

let lang = localStorage.getItem("cuentos-lang") || (navigator.language || "es").slice(0, 2);
if (lang !== "es" && lang !== "en") lang = "es";

let route = { view: "home", story: 0, page: 0 };
let speaking = false;
let deferredPrompt = null;
const app = document.getElementById("app");

/* Resuelve la imagen de un cuento: usa el paquete base64 si esta cargado
   (./cuentos-images.js) y, si no, cae al archivo suelto (./cuento-XX.jpg). */
function imgSrc(p) {
  if (!p) return p;
  const key = String(p).split("/").pop();
  return (window.CUENTOS_IMGS && window.CUENTOS_IMGS[key]) || p;
}

/* ---------------- Vistas ---------------- */
function cardHTML(s, i) {
  const media = s.img
    ? `<img class="thumb-img" src="${imgSrc(s.img)}" alt="" loading="lazy" decoding="async">`
    : s.svg;
  return `<button class="card" data-action="open" data-id="${i}" aria-label="${s.title[lang]}">
    <div class="thumb">${media}</div>
    <div class="card-title">${s.title[lang]}</div>
  </button>`;
}

function installHTML() {
  return `<button id="installBtn" class="install" data-action="install" ${deferredPrompt ? "" : "hidden"}>⬇ ${I18N[lang].install}</button>`;
}

/* ---------------- Anuncios (HilltopAds / red externa) ---------------- */
/* Inserta HTML que contiene <script> de forma que el navegador lo ejecute */
function injectHTMLWithScripts(container, html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  tpl.content.querySelectorAll("script").forEach((old) => {
    const s = document.createElement("script");
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    s.text = old.text;
    old.replaceWith(s);
  });
  container.appendChild(tpl.content);
}

/* Cada zona se inyecta UNA sola vez y luego se mueve entre vistas */
const adCache = {};
function mountAd(key, slot) {
  if (!slot) return;
  const c = window.ADS_CONFIG;
  if (!c || !c.enabled) return;
  const code = c.zones && c.zones[key];
  if (!code) {
    if (c.preview) {
      slot.innerHTML = '<span class="ad-tag">Publicidad</span><div class="ad-ph">Anuncio de ejemplo (' + key + ')</div>';
    }
    return;
  }
  if (adCache[key]) { slot.appendChild(adCache[key]); return; }
  const box = document.createElement("div");
  box.className = "ad-inner";
  injectHTMLWithScripts(box, code);
  adCache[key] = box;
  slot.appendChild(box);
}

function mountAds() {
  document.querySelectorAll("[data-ad]").forEach((el) => mountAd(el.dataset.ad, el));
}

function homeHTML() {
  return `<header class="top">
    <div class="brand">
      <img class="logo" src="./icon.svg" alt="">
      <div><h1>Cuentos Cortitos</h1><p class="sub">${I18N[lang].tagline}</p></div>
    </div>
    <button class="lang" data-action="lang" aria-label="Cambiar idioma">${lang === "es" ? "EN" : "ES"}</button>
  </header>
  <main class="grid">${STORIES.map(cardHTML).join("")}</main>
  <div class="ad-box" data-ad="home"></div>
  ${installHTML()}
  <footer>Hecho con cariño para leer en familia · ${STORIES.length} ${lang === "es" ? "cuentos" : "stories"}<br><a href="./privacidad.html">${lang === "es" ? "Privacidad y anuncios" : "Privacy & ads"}</a></footer>`;
}

function storyPages(s) {
  const pages = s.pages.map((p) => ({ es: p.es, en: p.en }));
  if (s.moraleja) pages.push({ es: s.moraleja.es, en: s.moraleja.en, moral: true });
  return pages;
}

function pageText(p) {
  return (p.moral ? (lang === "es" ? "Moraleja: " : "Moral: ") : "") + p[lang];
}

function storyHTML() {
  const s = STORIES[route.story];
  const pages = storyPages(s);
  const total = pages.length;
  const p = pages[route.page];
  const dots = pages.map((_, i) => `<span class="dot${i === route.page ? " on" : ""}"></span>`).join("");
  const media = s.img ? `<img class="stage-img" src="${imgSrc(s.img)}" alt="">` : s.svg;
  const body = p.moral
    ? `<div class="moral"><div class="label">${lang === "es" ? "Moraleja" : "Moral"}</div><div class="txt">${p[lang]}</div></div>`
    : `<p class="page-text">${p[lang]}</p>`;
  return `<header class="top">
    <button class="round-btn" data-action="back" aria-label="${I18N[lang].back}">←</button>
    <div class="brand"><div><h1>${s.title[lang]}</h1><p class="sub">${route.page + 1} / ${total}</p></div></div>
    <button class="lang" data-action="lang" aria-label="Cambiar idioma">${lang === "es" ? "EN" : "ES"}</button>
  </header>
  <main class="story">
    <div class="stage">${media}</div>
    ${body}
    <div class="dots">${dots}</div>
    <div class="nav">
      <button class="round-btn" data-action="prev" ${route.page === 0 ? "disabled" : ""} aria-label="${I18N[lang].prev}">←</button>
      <button class="read-btn" data-action="read">🔊 ${I18N[lang].read}</button>
      <button class="round-btn" data-action="next" ${route.page === total - 1 ? "disabled" : ""} aria-label="${I18N[lang].next}">→</button>
    </div>
    ${route.page === total - 1 ? '<div class="ad-box" data-ad="story"></div>' : ""}
  </main>`;
}

function render() {
  app.innerHTML = route.view === "home" ? homeHTML() : storyHTML();
  window.scrollTo(0, 0);
  updateReadBtn();
  mountAds();
}

/* ---------------- Lectura en voz alta ---------------- */
function updateReadBtn() {
  const b = document.querySelector('[data-action="read"]');
  if (b) b.textContent = (speaking ? "⏹ " + I18N[lang].stop : "🔊 " + I18N[lang].read);
}

function stopSpeak() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  speaking = false;
  updateReadBtn();
}

function toggleRead() {
  if (!("speechSynthesis" in window)) { alert(I18N[lang].noVoice); return; }
  if (window.speechSynthesis.speaking) { stopSpeak(); return; }
  const text = route.view === "story"
    ? pageText(storyPages(STORIES[route.story])[route.page])
    : STORIES.map((s) => s.title[lang]).join(". ");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "es" ? "es-ES" : "en-US";
  u.rate = 0.88;
  u.pitch = 1.05;
  u.onend = () => { speaking = false; updateReadBtn(); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  speaking = true;
  updateReadBtn();
}

/* ---------------- Eventos ---------------- */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "open") { stopSpeak(); route = { view: "story", story: +el.dataset.id, page: 0 }; render(); }
  else if (a === "back") { stopSpeak(); route = { view: "home", story: 0, page: 0 }; render(); }
  else if (a === "prev") { if (route.page > 0) { route.page--; stopSpeak(); render(); } }
  else if (a === "next") { if (route.page < storyPages(STORIES[route.story]).length - 1) { route.page++; stopSpeak(); render(); } }
  else if (a === "lang") { lang = lang === "es" ? "en" : "es"; localStorage.setItem("cuentos-lang", lang); stopSpeak(); render(); }
  else if (a === "read") { toggleRead(); }
  else if (a === "install") { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } }
});

document.addEventListener("keydown", (ev) => {
  if (route.view !== "story") return;
  if (ev.key === "ArrowRight") document.querySelector('[data-action="next"]:not([disabled])')?.click();
  if (ev.key === "ArrowLeft") document.querySelector('[data-action="prev"]:not([disabled])')?.click();
});

window.addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  deferredPrompt = ev;
  const b = document.getElementById("installBtn");
  if (b) b.hidden = false; else if (route.view === "home") render();
});

window.addEventListener("appinstalled", () => { deferredPrompt = null; });

/* ---------------- PWA ---------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

render();
</script>
</body>
